<!DOCTYPE html>
<html lang="{{ with site.LanguageCode }}{{ . }}{{ else }}en-us{{ end }}">

{{ partial "head.html" . }}

<body id="body" data-spy="scroll" data-target=".navbar" data-offset="55">
  
  <div id="content">
    {{ partial "preloader.html" . }}
    {{- block "main" . }}
    {{- end }}
  </div>
  
  {{- partial "footer.html" . -}}

      <!-- form handling -->
    <script>

      let form = document.getElementById("contact-form");
      let formResponse = document.getElementById("form-response");

      // hide the form response div from the layout until we get response 

      //  create content elements for the form response div
      let strongElement = document.getElementById("warning-smg");
      let spanIcon = document.getElementById("closing-icon");
      
      async function handleSubmit(event) {
        event.preventDefault();
        let data = new FormData(event.target);
        fetch(event.target.action, {
          method: form.method,
          body: data,
          headers: {
            Accept: "application/json",
          },
        })
        .then((response) => {
            if (response.ok && response.status == 200) {
              // spanIcon.innerHTML = "&times;";
              // strongElement.innerHTML = "Success!";
              formResponse.classList.add("alert-success");
              formResponse.innerHTML = "Thank you for contacting MuchaTech";
              form.reset();
            }
          })
        .catch((error) => {
            // spanIcon.innerHTML = "&times;";
            // strongElement.innerHTML = "Error!";
            formResponse.classList.add("alert-warning");
            formResponse.innerHTML = "There was a problem submitting your form";
        });
      }
      form.addEventListener("submit", handleSubmit);

    </script>

    <script>
      const navigationMenu = document.getElementById("navigation");
      if (navigationMenu) {
        navigationMenu.addEventListener("click", (event) => {
          const link = event.target.closest("a.nav-link:not(.dropdown-toggle), a.dropdown-item");
          if (link && window.matchMedia("(max-width: 991.98px)").matches) {
            window.jQuery(navigationMenu).collapse("hide");
          }
        }, true);
      }
    </script>

</body>

</html>
