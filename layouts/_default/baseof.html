<!DOCTYPE html>
<html lang="{{ with site.LanguageCode }}{{ . }}{{ else }}en-us{{ end }}">

{{ partial "head.html" . }}

<body id="body" data-spy="scroll" data-target=".navbar" data-offset="55">
  
  <div id="content">
    {{ partial "preloader.html" . }}
    {{- block "main" . }}
    {{- end }}
  </div>
  
  {{- partial "footer.html" . -}}

    {{ if .IsHome }}
      <div class="contact-toast-container" aria-live="polite" aria-atomic="true">
        <div id="contact-toast" class="toast fade contact-toast" role="status" aria-live="polite" aria-atomic="true">
          <div class="toast-header">
            <span class="contact-toast-icon" aria-hidden="true"></span>
            <strong id="contact-toast-title" class="mr-auto"></strong>
            <button type="button" class="ml-2 mb-1 close" data-dismiss="toast" aria-label="Close notification">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div id="contact-toast-message" class="toast-body"></div>
        </div>
      </div>
    {{ end }}

    {{ if hugo.IsProduction }}
      <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
      </script>
      <script defer src="/_vercel/insights/script.js"></script>
      <script defer src="/_vercel/speed-insights/script.js"></script>
    {{ end }}

</body>

</html>
