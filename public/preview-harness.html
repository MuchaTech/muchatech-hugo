<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MuchaTech preview harness</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0d1114; }
      iframe { display: block; width: 1440px; height: 1200px; border: 0; }
    </style>
  </head>
  <body>
    <iframe id="preview" src="about:blank"></iframe>
    <script>
      const target = new URLSearchParams(location.search).get("url");
      if (target) document.getElementById("preview").src = target;
    </script>
  </body>
</html>
