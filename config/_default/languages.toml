################################### Languages #####################################
# Single source of truth for language configuration. Do not repeat these
# [Languages.*] blocks in hugo.toml — duplicate keys there are silently
# overridden by this file, which is how the footer copyright drifted before.

################################### English language #####################################
[en]
languageName = "En"
languageCode = "en-us"
contentDir = "content/english"
weight = 1
[en.params]
home = "Home"
copyright = "Copyright &copy; 2020-2026 All rights reserved."

################################### French language #####################################
[fr]
languageName = "Fr"
languageCode = "fr-fr"
contentDir = "content/french"
weight = 2
[fr.params]
home = "Accueil"
copyright = "Copyright &copy; 2020-2026 All rights reserved."
